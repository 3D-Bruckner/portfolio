name: ci
on:
  # Every branch, so work in progress is checked before its pull request; the image is published from main only.
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  # The Playwright version the lockfile pins, so the check runs in the image made for exactly that version.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" >> "$GITHUB_OUTPUT"
  # Microsoft's Playwright image has the browsers and their system libraries built in: the check needs no apt, so an outage of the Ubuntu
  # mirrors can't fail it. setup-node still pins .nvmrc's Node, whatever the image ships. Keep the job's name: main's ruleset will
  # require it once the repository gets rulesets.
  check:
    needs: playwright
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
  # The image, built and started on every push; pushed to ghcr.io/3d-bruckner/upload:main only from main, once check passed.
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The image is started once before it is pushed: an image that builds but cannot start must never reach a server.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: upload:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and answers
        run: |
          docker run -d --name smoke -p 127.0.0.1:3000:3000 -e PUBLIC_URL=http://127.0.0.1:3000 -e UPLOAD_SECRET="$(openssl rand -hex 32)" upload:smoke
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:3000/health)" = '{"status":"ok"}'
          # The pages speak the browser's language.
          curl -s -H 'accept-language: de-DE' http://127.0.0.1:3000/ | grep -q '<html lang="de"'
          # Outgoing HTTPS trusts the system store: the server runs with --use-system-ca.
          docker inspect --format '{{json .Config.Entrypoint}}' upload:smoke | grep -q -- --use-system-ca
          # Docker's own health check (a node script: the distroless image has no shell) reports healthy.
          for i in $(seq 1 20); do [ "$(docker inspect --format '{{.State.Health.Status}}' smoke)" = healthy ] && break; sleep 3; done
          test "$(docker inspect --format '{{.State.Health.Status}}' smoke)" = healthy
          docker logs smoke
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/3d-bruckner/upload:main
            ghcr.io/3d-bruckner/upload:sha-${{ github.sha }}
          cache-from: type=gha
          # Attached to the image in the registry: what it contains, and how and from which commit it was built.
          sbom: true
          provenance: mode=max
